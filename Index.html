<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plano de Manutenção Semanal 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #f0a500;
    --accent2: #e05c1a;
    --text: #e6edf3;
    --muted: #8b949e;
    --success: #3fb950;
    --card-bg: #1c2128;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BACKGROUND GRID */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(240,165,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240,165,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* HEADER */
  header {
    text-align: center;
    margin-bottom: 48px;
  }

  .header-tag {
    display: inline-block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(240,165,0,0.3);
    padding: 4px 14px;
    border-radius: 2px;
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(36px, 6vw, 56px);
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
    text-transform: uppercase;
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  /* SEARCH BOX */
  .search-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 32px;
    margin-bottom: 40px;
    position: relative;
    overflow: hidden;
  }

  .search-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .search-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    display: block;
  }

  .input-row {
    display: flex;
    gap: 12px;
    align-items: stretch;
  }

  .week-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 700;
    padding: 14px 20px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    text-align: center;
    letter-spacing: 2px;
    -moz-appearance: textfield;
  }

  .week-input::-webkit-inner-spin-button,
  .week-input::-webkit-outer-spin-button { -webkit-appearance: none; }

  .week-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(240,165,0,0.15);
  }

  .week-input::placeholder {
    color: var(--border);
    font-size: 22px;
  }

  .btn-search {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    border: none;
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 0 32px;
    border-radius: 6px;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  .btn-search:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-search:active { transform: translateY(0); }

  /* WEEK NAV */
  .week-nav {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn-nav {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 4px;
    transition: all 0.15s;
  }

  .btn-nav:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* RESULT AREA */
  #result {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  #result.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* RESULT HEADER */
  .result-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    gap: 16px;
    flex-wrap: wrap;
  }

  .week-display {
    font-family: 'Barlow Condensed', sans-serif;
  }

  .week-number-big {
    font-size: clamp(48px, 10vw, 80px);
    font-weight: 800;
    line-height: 0.9;
    color: var(--accent);
    letter-spacing: -2px;
  }

  .week-label {
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .stats-bar {
    display: flex;
    gap: 24px;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
  }

  .stat-lbl {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* CARDS GRID */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .eq-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    animation: cardIn 0.35s ease both;
  }

  .eq-card:hover {
    border-color: rgba(240,165,0,0.5);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 0 1px rgba(240,165,0,0.1);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-ficha {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 800;
    min-width: 44px;
    height: 44px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    letter-spacing: -0.5px;
  }

  .card-body {}

  .card-num-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .card-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.35;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.4;
  }

  .empty-state h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    color: var(--text);
    opacity: 0.6;
  }

  /* PROGRESS RING */
  .progress-ring-wrap {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }

  .ring-svg { flex-shrink: 0; }

  .ring-info { flex: 1; }

  .ring-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .ring-text {
    font-size: 13px;
    color: var(--text);
    opacity: 0.8;
  }

  /* WEEK STRIP */
  .month-blocks {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }

  .month-block {
    flex: 1;
    min-width: 56px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 6px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
  }

  .month-block:hover {
    border-color: var(--accent);
    background: var(--surface2);
  }

  .month-block.active {
    border-color: var(--accent);
    background: rgba(240,165,0,0.1);
  }

  .month-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .month-weeks {
    display: flex;
    gap: 2px;
    justify-content: center;
  }

  .mw-dot {
    width: 8px;
    height: 8px;
    border-radius: 1px;
    background: var(--border);
    cursor: pointer;
    transition: background 0.15s;
  }

  .mw-dot:hover { background: var(--accent); }
  .mw-dot.active { background: var(--accent); }

  /* PRINT */
  .print-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 4px;
    transition: all 0.15s;
    margin-top: 24px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .print-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  @media print {
    body { background: white; color: black; }
    body::before { display: none; }
    .search-section, .month-blocks, .print-btn { display: none; }
    .eq-card { border: 1px solid #ccc; break-inside: avoid; }
    #result { opacity: 1; transform: none; }
  }

  @media (max-width: 480px) {
    .input-row { flex-direction: column; }
    .btn-search { padding: 14px; }
    .stats-bar { gap: 16px; }
  }
</style>
</head>

      <button class="btn-nav" onclick="changeWeek(4)">+4 ▶▶</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result"></div>

</div>

// Month definitions (approximate week ranges)
const MONTHS = [
  { name: 'Jan', weeks: [1,2,3,4] },
  { name: 'Fev', weeks: [5,6,7,8] },
  { name: 'Mar', weeks: [9,10,11,12,13] },
  { name: 'Abr', weeks: [14,15,16,17] },
  { name: 'Mai', weeks: [18,19,20,21,22] },
  { name: 'Jun', weeks: [23,24,25,26] },
  { name: 'Jul', weeks: [27,28,29,30,31] },
  { name: 'Ago', weeks: [32,33,34,35] },
  { name: 'Set', weeks: [36,37,38,39] },
  { name: 'Out', weeks: [40,41,42,43,44] },
  { name: 'Nov', weeks: [45,46,47,48] },
  { name: 'Dez', weeks: [49,50,51,52] },
];

let currentWeek = null;

// Build month strip
function buildMonthStrip() {
  const strip = document.getElementById('monthStrip');
  MONTHS.forEach(m => {
    const block = document.createElement('div');
    block.className = 'month-block';
    block.id = 'month-' + m.name;
    block.innerHTML = `
      <div class="month-name">${m.name}</div>
      <div class="month-weeks" id="mwrap-${m.name}">
        ${m.weeks.map(w => `<div class="mw-dot" id="dot-${w}" title="Semana ${w}" onclick="selectWeek(${w})"></div>`).join('')}
      </div>
    `;
    block.addEventListener('click', (e) => {
      if (!e.target.classList.contains('mw-dot')) selectWeek(m.weeks[0]);
    });
    strip.appendChild(block);
  });
}

function selectWeek(w) {
  document.getElementById('weekInput').value = w;
  showWeek();
}

function getCurrentWeekOfYear() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 1);
  const diff = now - start;
  const oneWeek = 7 * 24 * 60 * 60 * 1000;
  return Math.ceil((diff / oneWeek) + start.getDay() / 7);
}

function setCurrentWeek() {
  const w = Math.min(52, Math.max(1, getCurrentWeekOfYear()));
  document.getElementById('weekInput').value = w;
  showWeek();
}

function changeWeek(delta) {
  const current = parseInt(document.getElementById('weekInput').value) || 1;
  const next = Math.min(52, Math.max(1, current + delta));
  document.getElementById('weekInput').value = next;
  showWeek();
}

function updateDots(week) {
  document.querySelectorAll('.mw-dot').forEach(d => d.classList.remove('active'));
  document.querySelectorAll('.month-block').forEach(b => b.classList.remove('active'));
  const dot = document.getElementById('dot-' + week);
  if (dot) {
    dot.classList.add('active');
    // find parent month block
    const wrap = dot.closest('.month-block');
    if (wrap) wrap.classList.add('active');
  }
}

function getMonthName(week) {
  for (const m of MONTHS) {
    if (m.weeks.includes(week)) return m.name;
  }
  return '';
}

function showWeek() {
  const input = document.getElementById('weekInput');
  const week = parseInt(input.value);
  if (!week || week < 1 || week > 52) {
    alert('Por favor insira uma semana entre 1 e 52.');
    return;
  }

  currentWeek = week;
  updateDots(week);

  const items = DATA[week] || [];
  const result = document.getElementById('result');
  const monthName = getMonthName(week);

  if (items.length === 0) {
    result.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔧</div>
        <h3>Sem intervenções</h3>
        <p>Nenhum equipamento agendado para a semana ${week}.</p>
      </div>`;
  } else {
    // Progress ring data
    const maxItems = 14; // approx max
    const pct = Math.min(100, Math.round((items.length / maxItems) * 100));
    const circumference = 2 * Math.PI * 28;
    const offset = circumference - (pct / 100) * circumference;

    const cards = items.map((item, i) => `
      <div class="eq-card" style="animation-delay:${i * 0.04}s">
        <div class="card-ficha">${item.ficha}</div>
        <div class="card-body">
          <div class="card-num-label">Ficha nº ${item.ficha}</div>
          <div class="card-name">${item.equipamento}</div>
        </div>
      </div>
    `).join('');

    result.innerHTML = `
      <div class="result-header">
        <div class="week-display">
          <div class="week-number-big">${String(week).padStart(2,'0')}</div>
          <div class="week-label">Semana do ano · ${monthName}</div>
        </div>
        <div class="stats-bar">
          <div class="stat">
            <div class="stat-num">${items.length}</div>
            <div class="stat-lbl">Equipamentos</div>
          </div>
          <div class="stat">
            <div class="stat-num">${items.length}</div>
            <div class="stat-lbl">Fichas</div>
          </div>
        </div>
      </div>

      <div class="progress-ring-wrap">
        <svg class="ring-svg" width="64" height="64" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="28" fill="none" stroke="#30363d" stroke-width="6"/>
          <circle cx="32" cy="32" r="28" fill="none" stroke="#f0a500" stroke-width="6"
            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
            stroke-linecap="round" transform="rotate(-90 32 32)"
            style="transition:stroke-dashoffset 0.8s ease"/>
          <text x="32" y="37" text-anchor="middle" fill="#f0a500"
            font-family="Barlow Condensed,sans-serif" font-size="16" font-weight="700">${items.length}</text>
        </svg>
        <div class="ring-info">
          <div class="ring-title">Carga de Trabalho</div>
          <div class="ring-text">${items.length} equipamento${items.length !== 1 ? 's' : ''} a intervencionar esta semana.</div>
        </div>
        <button class="print-btn" onclick="window.print()">🖨 Imprimir</button>
      </div>

      <div class="cards-grid">${cards}</div>
    `;
  }

  result.classList.remove('visible');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => result.classList.add('visible'));
  });
}

// Keyboard support
document.getElementById('weekInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') showWeek();
  if (e.key === 'ArrowUp') changeWeek(1);
  if (e.key === 'ArrowDown') changeWeek(-1);
});

// Init
buildMonthStrip();
setCurrentWeek();
</script>
</body>
</html>
