<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plano de Manutenção Semanal 2026 - v2</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #f0a500;
    --accent2: #e05c1a;
    --text: #e6edf3;
    --muted: #8b949e;
    --success: #3fb950;
    --danger: #f85149;
    --card-bg: #1c2128;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(240,165,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240,165,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  .header-tag {
    display: inline-block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(240,165,0,0.3);
    padding: 4px 14px;
    border-radius: 2px;
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(36px, 6vw, 56px);
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
    text-transform: uppercase;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--border);
  }

  .tab {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 14px 8px;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
  }

  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab:hover { color: var(--text); }

  .view { display: none; }
  .view.active { display: block; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* SEARCH BOX */
  .search-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 32px;
    margin-bottom: 40px;
    position: relative;
    overflow: hidden;
  }

  .search-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .search-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    display: block;
  }

  .input-row {
    display: flex;
    gap: 12px;
    align-items: stretch;
  }

  .week-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 700;
    padding: 14px 20px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    text-align: center;
    letter-spacing: 2px;
    -moz-appearance: textfield;
  }

  .week-input::-webkit-inner-spin-button,
  .week-input::-webkit-outer-spin-button { -webkit-appearance: none; }

  .week-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(240,165,0,0.15);
  }

  .week-input::placeholder { color: var(--border); font-size: 22px; }

  .btn-search {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    border: none;
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 0 32px;
    border-radius: 6px;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  .btn-search:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-search:active { transform: translateY(0); }

  .week-nav {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn-nav {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 4px;
    transition: all 0.15s;
  }

  .btn-nav:hover { border-color: var(--accent); color: var(--accent); }

  #result {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  #result.visible { opacity: 1; transform: translateY(0); }

  .result-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    gap: 16px;
    flex-wrap: wrap;
  }

  .week-display { font-family: 'Barlow Condensed', sans-serif; }

  .week-number-big {
    font-size: clamp(48px, 10vw, 80px);
    font-weight: 800;
    line-height: 0.9;
    color: var(--accent);
    letter-spacing: -2px;
  }

  .week-label {
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .stats-bar { display: flex; gap: 24px; }

  .stat { text-align: center; }

  .stat-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
  }

  .stat-lbl {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .eq-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    animation: cardIn 0.35s ease both;
  }

  .eq-card:hover {
    border-color: rgba(240,165,0,0.5);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 0 1px rgba(240,165,0,0.1);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-ficha {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 800;
    min-width: 44px;
    height: 44px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    letter-spacing: -0.5px;
  }

  .card-num-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .card-name { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.35; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }

  .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }

  .empty-state h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    color: var(--text);
    opacity: 0.6;
  }

  .progress-ring-wrap {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .ring-svg { flex-shrink: 0; }
  .ring-info { flex: 1; min-width: 140px; }

  .ring-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .ring-text { font-size: 13px; color: var(--text); opacity: 0.8; }

  .month-blocks {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }

  .month-block {
    flex: 1;
    min-width: 56px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 6px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
  }

  .month-block:hover { border-color: var(--accent); background: var(--surface2); }
  .month-block.active { border-color: var(--accent); background: rgba(240,165,0,0.1); }

  .month-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .month-weeks { display: flex; gap: 2px; justify-content: center; }

  .mw-dot {
    width: 8px;
    height: 8px;
    border-radius: 1px;
    background: var(--border);
    cursor: pointer;
    transition: background 0.15s;
  }

  .mw-dot:hover { background: var(--accent); }
  .mw-dot.active { background: var(--accent); }

  .print-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 4px;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .print-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* RELATORIOS VIEW */
  .report-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
  }

  .report-form::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .form-row { margin-bottom: 16px; }

  .form-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    display: block;
  }

  .form-input, .form-select, .form-textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(240,165,0,0.15);
  }

  .form-textarea {
    min-height: 120px;
    resize: vertical;
    font-family: 'Barlow', sans-serif;
    line-height: 1.5;
  }

  .text-with-mic { position: relative; }

  .mic-btn {
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.2s;
  }

  .mic-btn:hover { border-color: var(--accent); color: var(--accent); }

  .mic-btn.listening {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(248,81,73,0.5); }
    50% { box-shadow: 0 0 0 10px rgba(248,81,73,0); }
  }

  .mic-status {
    font-size: 12px;
    color: var(--accent);
    margin-top: 6px;
    min-height: 16px;
  }

  .severity-row { display: flex; gap: 10px; }

  .severity-btn {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 12px 8px;
    border-radius: 6px;
    transition: all 0.15s;
  }

  .severity-btn.active[data-level="info"] { background: rgba(63,185,80,0.15); border-color: var(--success); color: var(--success); }
  .severity-btn.active[data-level="aviso"] { background: rgba(240,165,0,0.15); border-color: var(--accent); color: var(--accent); }
  .severity-btn.active[data-level="urgente"] { background: rgba(248,81,73,0.15); border-color: var(--danger); color: var(--danger); }

  .btn-submit {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    border: none;
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 14px 32px;
    border-radius: 6px;
    transition: opacity 0.2s, transform 0.1s;
    width: 100%;
  }

  .btn-submit:hover { opacity: 0.9; }
  .btn-submit:active { transform: translateY(1px); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

  /* HISTORICO */
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .history-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .filter-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 6px;
    outline: none;
  }

  .report-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-left: 4px solid var(--muted);
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 12px;
    animation: cardIn 0.35s ease both;
  }

  .report-card.info { border-left-color: var(--success); }
  .report-card.aviso { border-left-color: var(--accent); }
  .report-card.urgente { border-left-color: var(--danger); }

  .report-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .report-meta {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .report-meta .author { color: var(--accent); }
  .report-meta .date { color: var(--muted); font-weight: 400; margin-left: 8px; }

  .report-badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 4px;
  }

  .report-badge.info { background: rgba(63,185,80,0.15); color: var(--success); }
  .report-badge.aviso { background: rgba(240,165,0,0.15); color: var(--accent); }
  .report-badge.urgente { background: rgba(248,81,73,0.15); color: var(--danger); }

  .report-text {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
  }

  .report-delete {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    margin-top: 10px;
    transition: all 0.15s;
  }

  .report-delete:hover { border-color: var(--danger); color: var(--danger); }

  .loading-state { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

  @media print {
    body { background: white; color: black; }
    body::before { display: none; }
    .search-section, .month-blocks, .print-btn, .tabs, .report-form { display: none; }
    .eq-card, .report-card { border: 1px solid #ccc; break-inside: avoid; }
    #result { opacity: 1; transform: none; }
  }

  @media (max-width: 480px) {
    .input-row { flex-direction: column; }
    .btn-search { padding: 14px; }
    .stats-bar { gap: 16px; }
    .severity-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <header>
    <div class="header-tag">Gestão de Instalações</div>
    <h1>Plano de <span>Manutenção</span></h1>
    <p class="subtitle">Equipamentos a intervencionar por semana do ano</p>
  </header>

  <div class="tabs">
    <button class="tab active" id="tabPlano" onclick="switchTab('plano')">📅 Plano Semanal</button>
    <button class="tab" id="tabRelatorios" onclick="switchTab('relatorios')">📋 Registos Diários</button>
  </div>

  <!-- VIEW: PLANO -->
  <div class="view active" id="viewPlano">
    <div class="month-blocks" id="monthStrip"></div>

    <div class="search-section">
      <span class="search-label">Seleccionar Semana</span>
      <div class="input-row">
        <input type="number" class="week-input" id="weekInput" placeholder="01 – 52" min="1" max="52">
        <button class="btn-search" onclick="showWeek()">▶ Consultar</button>
      </div>
      <div class="week-nav">
        <button class="btn-nav" onclick="changeWeek(-4)">◀◀ −4</button>
        <button class="btn-nav" onclick="changeWeek(-1)">◀ Anterior</button>
        <button class="btn-nav" onclick="setCurrentWeek()">Semana Actual</button>
        <button class="btn-nav" onclick="changeWeek(1)">Seguinte ▶</button>
        <button class="btn-nav" onclick="changeWeek(4)">+4 ▶▶</button>
      </div>
    </div>

    <div id="result"></div>
  </div>

  <!-- VIEW: RELATORIOS -->
  <div class="view" id="viewRelatorios">

    <div class="report-form">
      <div class="form-row">
        <label class="form-label">O seu nome</label>
        <input type="text" class="form-input" id="repAuthor" placeholder="ex: João Silva">
      </div>

      <div class="form-row">
        <label class="form-label">Tipo de registo</label>
        <div class="severity-row">
          <button class="severity-btn active" data-level="info" onclick="setSeverity('info')">ℹ Informação</button>
          <button class="severity-btn" data-level="aviso" onclick="setSeverity('aviso')">⚠ Aviso</button>
          <button class="severity-btn" data-level="urgente" onclick="setSeverity('urgente')">🚨 Urgente</button>
        </div>
      </div>

      <div class="form-row">
        <label class="form-label">Descrição da ocorrência / anomalia</label>
        <div class="text-with-mic">
          <textarea class="form-textarea" id="repText" placeholder="Descreva a ocorrência, ou use o microfone para ditar..."></textarea>
          <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="Ditar texto">🎤</button>
        </div>
        <div class="mic-status" id="micStatus"></div>
      </div>

      <button class="btn-submit" onclick="submitReport()">Guardar Registo</button>
    </div>

    <div class="history-header">
      <span class="history-title">Histórico de Registos</span>
      <select class="filter-select" id="filterSeverity" onchange="renderReports()">
        <option value="">Todos os tipos</option>
        <option value="info">ℹ Informação</option>
        <option value="aviso">⚠ Aviso</option>
        <option value="urgente">🚨 Urgente</option>
      </select>
    </div>

    <div id="reportsList"><div class="loading-state">A carregar registos…</div></div>
  </div>

const MONTHS = [
  { name: 'Jan', weeks: [1,2,3,4] },
  { name: 'Fev', weeks: [5,6,7,8] },
  { name: 'Mar', weeks: [9,10,11,12,13] },
  { name: 'Abr', weeks: [14,15,16,17] },
  { name: 'Mai', weeks: [18,19,20,21,22] },
  { name: 'Jun', weeks: [23,24,25,26] },
  { name: 'Jul', weeks: [27,28,29,30,31] },
  { name: 'Ago', weeks: [32,33,34,35] },
  { name: 'Set', weeks: [36,37,38,39] },
  { name: 'Out', weeks: [40,41,42,43,44] },
  { name: 'Nov', weeks: [45,46,47,48] },
  { name: 'Dez', weeks: [49,50,51,52] },
];

let currentWeek = null;
let currentSeverity = 'info';

/* ===================== TABS ===================== */
function switchTab(name) {
  document.getElementById('tabPlano').classList.toggle('active', name === 'plano');
  document.getElementById('tabRelatorios').classList.toggle('active', name === 'relatorios');
  document.getElementById('viewPlano').classList.toggle('active', name === 'plano');
  document.getElementById('viewRelatorios').classList.toggle('active', name === 'relatorios');
  if (name === 'relatorios') renderReports();
}

/* ===================== PLANO SEMANAL ===================== */
function buildMonthStrip() {
  const strip = document.getElementById('monthStrip');
  MONTHS.forEach(m => {
    const block = document.createElement('div');
    block.className = 'month-block';
    block.id = 'month-' + m.name;
    block.innerHTML = `
      <div class="month-name">${m.name}</div>
      <div class="month-weeks" id="mwrap-${m.name}">
        ${m.weeks.map(w => `<div class="mw-dot" id="dot-${w}" title="Semana ${w}" onclick="selectWeek(${w})"></div>`).join('')}
      </div>
    `;
    block.addEventListener('click', (e) => {
      if (!e.target.classList.contains('mw-dot')) selectWeek(m.weeks[0]);
    });
    strip.appendChild(block);
  });
}

function selectWeek(w) {
  document.getElementById('weekInput').value = w;
  showWeek();
}

function getCurrentWeekOfYear() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 1);
  const diff = now - start;
  const oneWeek = 7 * 24 * 60 * 60 * 1000;
  return Math.ceil((diff / oneWeek) + start.getDay() / 7);
}

function setCurrentWeek() {
  const w = Math.min(52, Math.max(1, getCurrentWeekOfYear()));
  document.getElementById('weekInput').value = w;
  showWeek();
}

function changeWeek(delta) {
  const current = parseInt(document.getElementById('weekInput').value) || 1;
  const next = Math.min(52, Math.max(1, current + delta));
  document.getElementById('weekInput').value = next;
  showWeek();
}

function updateDots(week) {
  document.querySelectorAll('.mw-dot').forEach(d => d.classList.remove('active'));
  document.querySelectorAll('.month-block').forEach(b => b.classList.remove('active'));
  const dot = document.getElementById('dot-' + week);
  if (dot) {
    dot.classList.add('active');
    const wrap = dot.closest('.month-block');
    if (wrap) wrap.classList.add('active');
  }
}

function getMonthName(week) {
  for (const m of MONTHS) {
    if (m.weeks.includes(week)) return m.name;
  }
  return '';
}

function showWeek() {
  const input = document.getElementById('weekInput');
  const week = parseInt(input.value);
  if (!week || week < 1 || week > 52) {
    alert('Por favor insira uma semana entre 1 e 52.');
    return;
  }

  currentWeek = week;
  updateDots(week);

  const items = DATA[week] || [];
  const result = document.getElementById('result');
  const monthName = getMonthName(week);

  if (items.length === 0) {
    result.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔧</div>
        <h3>Sem intervenções</h3>
        <p>Nenhum equipamento agendado para a semana ${week}.</p>
      </div>`;
  } else {
    const maxItems = 14;
    const pct = Math.min(100, Math.round((items.length / maxItems) * 100));
    const circumference = 2 * Math.PI * 28;
    const offset = circumference - (pct / 100) * circumference;

    const cards = items.map((item, i) => `
      <div class="eq-card" style="animation-delay:${i * 0.04}s">
        <div class="card-ficha">${item.ficha}</div>
        <div class="card-body">
          <div class="card-num-label">Ficha nº ${item.ficha}</div>
          <div class="card-name">${item.equipamento}</div>
        </div>
      </div>
    `).join('');

    result.innerHTML = `
      <div class="result-header">
        <div class="week-display">
          <div class="week-number-big">${String(week).padStart(2,'0')}</div>
          <div class="week-label">Semana do ano · ${monthName}</div>
        </div>
        <div class="stats-bar">
          <div class="stat">
            <div class="stat-num">${items.length}</div>
            <div class="stat-lbl">Equipamentos</div>
          </div>
          <div class="stat">
            <div class="stat-num">${items.length}</div>
            <div class="stat-lbl">Fichas</div>
          </div>
        </div>
      </div>

      <div class="progress-ring-wrap">
        <svg class="ring-svg" width="64" height="64" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="28" fill="none" stroke="#30363d" stroke-width="6"/>
          <circle cx="32" cy="32" r="28" fill="none" stroke="#f0a500" stroke-width="6"
            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
            stroke-linecap="round" transform="rotate(-90 32 32)"
            style="transition:stroke-dashoffset 0.8s ease"/>
          <text x="32" y="37" text-anchor="middle" fill="#f0a500"
            font-family="Barlow Condensed,sans-serif" font-size="16" font-weight="700">${items.length}</text>
        </svg>
        <div class="ring-info">
          <div class="ring-title">Carga de Trabalho</div>
          <div class="ring-text">${items.length} equipamento${items.length !== 1 ? 's' : ''} a intervencionar esta semana.</div>
        </div>
        <button class="print-btn" onclick="window.print()">🖨 Imprimir</button>
      </div>

      <div class="cards-grid">${cards}</div>
    `;
  }

  result.classList.remove('visible');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => result.classList.add('visible'));
  });
}

document.getElementById('weekInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') showWeek();
  if (e.key === 'ArrowUp') changeWeek(1);
  if (e.key === 'ArrowDown') changeWeek(-1);
});

/* ===================== RELATORIOS ===================== */

function setSeverity(level) {
  currentSeverity = level;
  document.querySelectorAll('.severity-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.level === level);
  });
}

/* --- Voice recognition --- */
let recognition = null;
let isListening = false;

function setupSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById('micStatus').textContent = 'Reconhecimento de voz não suportado neste browser.';
    document.getElementById('micBtn').style.display = 'none';
    return;
  }
  recognition = new SR();
  recognition.lang = 'pt-PT';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (event) => {
    let finalText = '';
    let interimText = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalText += transcript + ' ';
      } else {
        interimText += transcript;
      }
    }
    const textarea = document.getElementById('repText');
    if (finalText) {
      textarea.dataset.baseText = (textarea.dataset.baseText || '') + finalText;
      textarea.value = textarea.dataset.baseText;
    }
    if (interimText) {
      textarea.value = (textarea.dataset.baseText || '') + interimText;
    }
    document.getElementById('micStatus').textContent = '🎤 A ouvir... fale agora';
  };

  recognition.onerror = (event) => {
    document.getElementById('micStatus').textContent = 'Erro no reconhecimento: ' + event.error;
    stopListening();
  };

  recognition.onend = () => {
    if (isListening) {
      // restart automatically for continuous dictation
      try { recognition.start(); } catch (e) {}
    }
  };
}

function toggleMic() {
  if (!recognition) return;
  if (isListening) {
    stopListening();
  } else {
    startListening();
  }
}

function startListening() {
  const textarea = document.getElementById('repText');
  textarea.dataset.baseText = textarea.value ? textarea.value + ' ' : '';
  isListening = true;
  document.getElementById('micBtn').classList.add('listening');
  document.getElementById('micStatus').textContent = '🎤 A ouvir... fale agora';
  try { recognition.start(); } catch (e) {}
}

function stopListening() {
  isListening = false;
  document.getElementById('micBtn').classList.remove('listening');
  document.getElementById('micStatus').textContent = '';
  try { recognition.stop(); } catch (e) {}
}

/* --- Storage (shared) --- */
async function submitReport() {
  const author = document.getElementById('repAuthor').value.trim();
  const text = document.getElementById('repText').value.trim();

  if (!author) { alert('Por favor indique o seu nome.'); return; }
  if (!text) { alert('Por favor escreva ou dite a descrição.'); return; }

  if (isListening) stopListening();

  const btn = document.querySelector('.btn-submit');
  btn.disabled = true;
  btn.textContent = 'A guardar...';

  const id = 'rep_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  const entry = {
    id,
    author,
    text,
    severity: currentSeverity,
    timestamp: new Date().toISOString()
  };

  try {
    await window.storage.set(id, JSON.stringify(entry), true);

    // update index list
    let index = [];
    try {
      const idxRes = await window.storage.get('reports_index', true);
      index = JSON.parse(idxRes.value);
    } catch (e) { index = []; }
    index.unshift(id);
    await window.storage.set('reports_index', JSON.stringify(index), true);

    // reset form
    document.getElementById('repText').value = '';
    document.getElementById('repText').dataset.baseText = '';
    setSeverity('info');

    await renderReports();
  } catch (err) {
    console.error(err);
    alert('Erro ao guardar o registo. Tente novamente.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Guardar Registo';
  }
}

async function deleteReport(id) {
  if (!confirm('Eliminar este registo permanentemente?')) return;
  try {
    await window.storage.delete(id, true);
    let index = [];
    try {
      const idxRes = await window.storage.get('reports_index', true);
      index = JSON.parse(idxRes.value);
    } catch (e) { index = []; }
    index = index.filter(x => x !== id);
    await window.storage.set('reports_index', JSON.stringify(index), true);
    await renderReports();
  } catch (err) {
    console.error(err);
    alert('Erro ao eliminar o registo.');
  }
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
    ' às ' + d.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
}

const SEVERITY_LABELS = { info: 'ℹ Informação', aviso: '⚠ Aviso', urgente: '🚨 Urgente' };

async function renderReports() {
  const list = document.getElementById('reportsList');
  const filter = document.getElementById('filterSeverity').value;

  list.innerHTML = '<div class="loading-state">A carregar registos…</div>';

  try {
    let index = [];
    try {
      const idxRes = await window.storage.get('reports_index', true);
      index = JSON.parse(idxRes.value);
    } catch (e) { index = []; }

    if (index.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📋</div>
          <h3>Sem registos</h3>
          <p>Ainda não foram criados relatórios.</p>
        </div>`;
      return;
    }

    const entries = [];
    for (const id of index) {
      try {
        const res = await window.storage.get(id, true);
        entries.push(JSON.parse(res.value));
      } catch (e) { /* skip missing */ }
    }

    const filtered = filter ? entries.filter(e => e.severity === filter) : entries;

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📋</div>
          <h3>Sem resultados</h3>
          <p>Nenhum registo corresponde ao filtro seleccionado.</p>
        </div>`;
      return;
    }

    list.innerHTML = filtered.map((e, i) => `
      <div class="report-card ${e.severity}" style="animation-delay:${i * 0.03}s">
        <div class="report-card-top">
          <div class="report-meta">
            <span class="author">${escapeHtml(e.author)}</span>
            <span class="date">${formatDate(e.timestamp)}</span>
          </div>
          <span class="report-badge ${e.severity}">${SEVERITY_LABELS[e.severity] || e.severity}</span>
        </div>
        <div class="report-text">${escapeHtml(e.text)}</div>
        <button class="report-delete" onclick="deleteReport('${e.id}')">🗑 Eliminar</button>
      </div>
    `).join('');

  } catch (err) {
    console.error(err);
    list.innerHTML = '<div class="empty-state"><p>Erro ao carregar registos.</p></div>';
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ===================== INIT ===================== */
buildMonthStrip();
setCurrentWeek();
setupSpeechRecognition();
